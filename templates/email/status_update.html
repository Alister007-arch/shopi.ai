<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Status Update - Trovi</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
    .card { max-width: 580px; margin: 0 auto; background-color: #1e293b; border-radius: 12px; border: 1px solid #334155; padding: 32px; }
    .brand { font-size: 24px; font-weight: 700; color: #10b981; margin-bottom: 8px; }
    .header { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
    .status-badge { display: inline-block; padding: 6px 14px; border-radius: 6px; background-color: rgba(59, 130, 246, 0.2); color: #60a5fa; font-size: 14px; font-weight: 700; text-transform: uppercase; margin-bottom: 16px; }
    .footer { margin-top: 24px; font-size: 12px; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Trovi</div>
    <div class="status-badge">{{new_status}}</div>
    <h2 class="header">Order #{{order_number}} Update</h2>
    <p>The status of your Trovi order has been updated to <strong>{{new_status}}</strong>.</p>
    <div class="footer">
      Trovi Multi-Category Autonomous E-Commerce. Need help? Contact support@trovi.store
    </div>
  </div>
</body>
</html>
