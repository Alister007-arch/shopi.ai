# =============================================================================
# TROVI E-COMMERCE RETURNS, EXCHANGE AND REFUND POLICIES
# Deterministic Business Rules Configuration
# =============================================================================
# All windows, allowed reasons, approvals, fees, abuse limits, and customer
# policy texts are configured here. The Order Action Service and API must
# read every rule from this file with ZERO hardcoded numbers in code.
# =============================================================================

version: "1.0.0"
store_name: "Trovi"

# -----------------------------------------------------------------------------
# Customer Policy Text (Used by /policies page and get_policies tool)
# -----------------------------------------------------------------------------
customer_policy_text:
  title: "RETURNS, EXCHANGE AND REFUND POLICY"
  cancellation: |
    Cancel your order
    You can cancel free of charge until your order is shipped. Once shipped, you can refuse delivery or return it after delivery. Prepaid orders are refunded to the original payment method.
  food_and_grocery: |
    Food and grocery (honey, oats, oils, nuts, tea, snacks)
    For hygiene and safety, we do not accept returns for change of mind. Report within 48 hours of delivery with a photo if the item is damaged, leaking, expired, wrong, missing or has a quality issue. We will replace it or refund you.
  fresh_produce: |
    Fresh produce, milk and eggs
    Report within 24 hours of delivery with a photo if the item is damaged, spoiled, wrong or missing.
  clothing: |
    Clothing
    Return or exchange within 7 days if unworn with tags and original packaging. Innerwear is not returnable, except damaged or wrong items.
  electronics: |
    Electronics
    Within 7 days for defective, dead on arrival, damaged or wrong items. We replace first; if a replacement is not available, we refund. Warranty claims go through the brand.
  laptops: |
    Laptops & Computing
    Within 7 days for defective, dead on arrival, damaged or wrong items. Replacement first. Every laptop claim requires specialist technical verification before approval.
  home_kitchen: |
    Home & Kitchen
    Return, replace or exchange within 7 days for defective, damaged, wrong or unsatisfactory items.
  personal_care: |
    Personal Care & Grooming
    Report within 48 hours of delivery with photo if damaged, leaking, expired or wrong item. Items must be unopened and hygiene seals intact.
  luxury: |
    Luxury items
    Within 7 days if sealed, unused and complete with tags and certificates. Each return goes through an inspection.
  refunds: |
    Refunds
    Prepaid orders: 5 to 7 business days after we receive and check the item. COD orders: refunded to your bank account or UPI (we will ask for details). Delivery fee is refunded when the mistake is ours (damaged, wrong, missing, expired or defective item). Gift wrap and handling fees are not refundable. If you used a coupon, the refund is the amount you paid for that item.
  help: |
    Need help?
    Chat with Trovi AI (Ask Trovi), or email support@trovi.ai. Grievance officer: Aarav Sharma, grievance@trovi.ai. We reply within 24 hours.

# -----------------------------------------------------------------------------
# Cancellation Rules
# -----------------------------------------------------------------------------
cancellation:
  allowed_before_status: "shipped"
  free_of_charge: true
  allowed_reasons:
    - "changed_mind"
    - "found_better_price"
    - "delay_expected"
    - "mistake_in_order"
    - "other"
  prepaid_refund_destination: "original_payment_method"

