# -----------------------------------------------------------------------------
# Refund Rules and Deductions
# -----------------------------------------------------------------------------
refund:
  prepaid_sla_days_min: 5
  prepaid_sla_days_max: 7
  prepaid_destination: "original_payment_method"
  cod_destination: "bank_account_or_upi"
  delivery_fee_refundable_reasons:
    - "damaged"
    - "wrong_item"
    - "missing"
    - "expired"
    - "defective"
    - "dead_on_arrival"
    - "spoiled"
  non_refundable_fees:
    gift_wrap: true
    handling: true
    delivery_fee_on_customer_change: true
  coupon_policy: "refund_amount_paid_for_item"

# -----------------------------------------------------------------------------
# Approval & Human Review Thresholds
# -----------------------------------------------------------------------------
approvals:
  auto_approve_max_amount_inr: 10000
  luxury_always_human_review: true
  laptops_always_human_review: true
  human_review_reasons:
    - "quality_issue"
    - "defective"
    - "dead_on_arrival"

# -----------------------------------------------------------------------------
# Abuse Limits & Anti-Fraud Guardrails
# -----------------------------------------------------------------------------
abuse_limits:
  max_actions_per_user_30_days: 5
  max_action_amount_per_user_30_days_inr: 25000
  high_return_rate_threshold: 0.5
  flag_status: "needs_human_review"

# -----------------------------------------------------------------------------
# Contact & Grievance Details
# -----------------------------------------------------------------------------
contact_and_help:
  concierge: "Ask Trovi"
  support_email: "support@trovi.ai"
  grievance_officer_name: "Aarav Sharma"
  grievance_officer_email: "grievance@trovi.ai"
  response_sla_hours: 24
