name: CI Pipeline

on:
  push:
    branches: [ "main", "upgrade/production" ]
  pull_request:
    branches: [ "main", "upgrade/production" ]

jobs:
  backend-tests:
    name: Backend Test Suite (Pytest & Safety)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Initialize catalog database
        run: |
          python backend/setup_db.py

      - name: Run Pytest test suite (Concurrency, Idempotency, Safety, Security, Evals, Admin)
        env:
          PYTHONPATH: ".:backend"
        run: |
          python -m pytest backend/tests/ -v

      - name: Run Agent 60-Evaluation Benchmark Suite
        env:
          PYTHONPATH: ".:backend"
        run: |
          python evals/run_evals.py

      - name: Run legacy acceptance test suite
        env:
          PYTHONPATH: ".:backend"
        run: |
          python backend/test_suite.py

  frontend-build:
    name: Frontend Build & Asset Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend production bundle
        run: npm run build

  docker-smoke-test:
    name: Docker Build & Startup Health Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t trovi:ci .

      - name: Run container with minimum environment
        run: |
          docker run -d \
            --name trovi-smoke-test \
            -p 8000:8000 \
            -e PORT=8000 \
            -e ENVIRONMENT=development \
            -e JWT_SECRET_KEY=ci_test_jwt_secret_key_2026 \
            trovi:ci

      - name: Verify application startup and call /api/health
        run: |
          echo "Waiting for Trovi container to become healthy..."
          success=0
          for i in $(seq 1 30); do
            response=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/health || true)
            if [ "$response" = "200" ]; then
              echo "Health check succeeded! Response code: 200 (attempt $i/30)"
              curl -s http://127.0.0.1:8000/api/health
              echo ""
              success=1
              break
            fi
            echo "Waiting for /api/health... ($i/30, received HTTP $response)"
            sleep 2
          done

          if [ $success -ne 1 ]; then
            echo "::error::Trovi container failed to respond to /api/health within 60s"
            echo "--- Container Logs ---"
            docker logs trovi-smoke-test
            exit 1
          fi

      - name: Verify root and policies accessibility
        run: |
          curl -s -f http://127.0.0.1:8000/health
          curl -s -f http://127.0.0.1:8000/api/policies

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f trovi-smoke-test || true

